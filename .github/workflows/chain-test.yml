name: Chain Test

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - name: show context
        run: echo "run ${{ github.run_id }} number ${{ github.run_number }}"
      - name: dispatch next link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/chain-test.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch http_code=$code"
