name: RSI Alert

on:
  schedule:
    # كل ساعة عند الدقيقة 30 (UTC)
    - cron: "30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rsi-alert
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan 1H
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rsi_alert.py --tf 1h

      - name: Scan 4H (skips itself unless a 4h candle just closed)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rsi_alert.py --tf 4h
